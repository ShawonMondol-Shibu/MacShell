name: Finalize About This Linux

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'ShawonMondol-Shibu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate About This Linux
        shell: python
        run: |
          from pathlib import Path
          import re

          bar_path = Path('MacShell/MacBar.qml')
          dock_path = Path('MacShell/MacDock.qml')

          bar = bar_path.read_text(encoding='utf-8')
          pattern = re.compile(r'm\.push\(mi\("About This (?:Linux|Mac)",\s*"",\s*function \(\) \{.*?\}\);\);', re.S)
          bar2, n = pattern.subn('m.push(mi("About This Linux", "", function () { root.openSettings("about"); }));', bar, count=1)
          if n != 1:
              raise SystemExit('About This Linux/Mac menu entry not found')
          bar_path.write_text(bar2, encoding='utf-8')

          dock = dock_path.read_text(encoding='utf-8')
          start_marker = '        Component {\n            id: paneAbout\n'
          end_marker = '    readonly property real effMag:'
          start = dock.find(start_marker)
          end = dock.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('paneAbout boundaries not found')
          replacement = '''        Component {
            id: paneAbout
            Item {
                width: parent ? parent.width : 430
                height: aboutCard.implicitHeight
                AboutThisLinux {
                    id: aboutCard
                    anchors.horizontalCenter: parent.horizontalCenter
                    width: Math.min(430, parent.width)
                    height: implicitHeight
                }
            }
        }

'''
          dock_path.write_text(dock[:start] + replacement + dock[end:], encoding='utf-8')

      - name: Commit source changes
        run: |
          git config user.name "Shawon Mondol Shibu"
          git config user.email "Shawonmondolshibu@gmail.com"
          git add MacShell/MacBar.qml MacShell/MacDock.qml MacShell/AboutThisLinux.qml MacShell/AboutThisMac.qml
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: finalize About This Linux integration"
          git push
