name: Apply About This Mac

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'ShawonMondol-Shibu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate About This Mac
        shell: python
        run: |
          from pathlib import Path
          import re

          bar = Path('MacShell/MacBar.qml')
          dock = Path('MacShell/MacDock.qml')

          b = bar.read_text(encoding='utf-8')
          b2, n = re.subn(
              r'm\.push\(mi\("About This Linux", "", function \(\) \{.*?\}\);\);',
              'm.push(mi("About This Mac", "", function () { root.openSettings("about"); }));',
              b,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('About This Linux menu entry not found')
          bar.write_text(b2, encoding='utf-8')

          d = dock.read_text(encoding='utf-8')
          start = d.find('        Component {\n            id: paneAbout\n')
          end = d.find('    readonly property real effMag:', start)
          if start < 0 or end < 0:
              raise SystemExit('paneAbout boundaries not found')

          replacement = '''        Component {
            id: paneAbout
            Item {
                width: parent ? parent.width : 430
                height: aboutCard.implicitHeight
                AboutThisMac {
                    id: aboutCard
                    anchors.horizontalCenter: parent.horizontalCenter
                    width: Math.min(430, parent.width)
                    height: implicitHeight
                }
            }
        }

'''
          dock.write_text(d[:start] + replacement + d[end:], encoding='utf-8')

          Path('.github/workflows/apply-about-this-mac.yml').unlink(missing_ok=True)

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MacShell/MacDock.qml MacShell/MacBar.qml MacShell/AboutThisMac.qml .github/workflows/apply-about-this-mac.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate macOS-style About This Mac"
          git push
